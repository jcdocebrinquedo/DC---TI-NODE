[package]
name = "dc_core"
version = "2.0.0"
edition = "2021"
authors = ["Engenharia de Sistemas Corporativos - TI"]
description = "Core nativo (sidecar) do DC-TI: Win32, WMI, SMART, Event Viewer, HKLM e UAC expostos via JSON-RPC sobre stdio"

[lib]
name = "dc_core"
path = "src/lib.rs"

[[bin]]
name = "dc-core"
path = "src/main.rs"

[dependencies]
sysinfo = "0.30"
winreg = "0.52"
wmi = "0.13"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_System_EventLog",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_NetworkManagement_NetManagement",
] }

[build-dependencies]
embed-manifest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# 'unwind' (e não 'abort') para que catch_unwind converta panics em erro E_PANIC sem derrubar o sidecar.
panic = "unwind"
strip = true

